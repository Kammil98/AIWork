<h1>User List</h1>

@if (users$ | async; as users) {
  @if (users.length > 0) {
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p>No users found in the database.</p>
  }
} @else {
  <p>Loading users...</p>
}
