<h1>Remove Users</h1>

@if (users().length > 0) {
  <table>
    <thead>
      <tr>
        <th>
          <input
            type="checkbox"
            id="select-all"
            [checked]="allSelected()"
            (change)="toggleAll()"
            aria-label="Select all users"
          >
        </th>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr [class.selected]="isSelected(user.id)">
          <td>
            <input
              type="checkbox"
              [id]="'user-' + user.id"
              [checked]="isSelected(user.id)"
              (change)="toggleUser(user.id)"
              [attr.aria-label]="'Select ' + user.username"
            >
          </td>
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="actions">
    <button
      type="button"
      class="delete-btn"
      [disabled]="!hasSelection() || isDeleting()"
      (click)="deleteSelected()"
    >
      @if (isDeleting()) {
        Deleting...
      } @else {
        Delete selected ({{ selectedIds().size }})
      }
    </button>
  </div>
} @else {
  <p>No users found in the database.</p>
}
